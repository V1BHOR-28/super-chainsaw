<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ARIA</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0a0a0f; color: #fcd96a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      .c { text-align: center; padding: 2rem; }
      .l { width: 64px; height: 64px; margin: 0 auto 1rem;
           border: 3px solid #fcd96a; border-top-color: transparent;
           border-radius: 50%; animation: s 1s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      h1 { font-size: 1.2rem; margin: 0 0 0.5rem; font-weight: 500; }
      p { font-size: 0.875rem; opacity: 0.7; margin: 0; }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="l"></div>
      <h1>ARIA</h1>
      <p>Connecting&hellip;</p>
    </div>
    <script>
      // When server.url is set in capacitor.config.ts, Capacitor loads that URL
      // instead of this file. This placeholder is only shown if the remote URL
      // is unreachable.
      (function() {
        var u = "{{MOBILE_URL}}";
        setTimeout(function() {
          if (u && location.href.indexOf(u) === -1) {
            window.location.href = u;
          }
        }, 1500);
      })();
    </script>
  </body>
</html>
