# Render Blueprint — audiobook-maker Flask service
# https://render.com/docs/blueprint-spec
# One-click deploy: connect your GitHub repo, Render reads this file and
# creates the web service automatically.
#
# FREE TIER NOTE: Render's free tier does NOT support persistent disks.
# This blueprint uses ephemeral storage (/tmp/abm-data) — jobs and generated
# audio are LOST on every deploy/restart/spin-down. This is fine for testing.
#
# To get persistent storage (jobs survive restarts), either:
#   1. Upgrade to Starter plan ($7/mo) and uncomment the `disk:` section below, OR
#   2. Configure S3-compatible storage (Cloudflare R2, Backblaze B2, etc.)
#      by setting the ABM_S3_* env vars in the Render dashboard.

services:
  - type: web
    name: aria-audiobook-service
    runtime: python
    rootDir: mini-services/audiobook-maker
    # Install all dependencies: requirements.txt (boto3, flask-compress, etc.)
    # + the core deps the Flask app needs (flask, edge-tts, ebooklib, etc.)
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install flask edge-tts ebooklib beautifulsoup4 lxml Pillow pymupdf flask-compress defusedxml
    startCommand: python audiobook_app.py
    envVars:
      # Render provides $PORT automatically (typically 10000). The Flask app
      # detects $PORT and binds to 0.0.0.0:$PORT. Do NOT set ABM_PORT here —
      # it's only used when $PORT is absent (local dev / sandbox).
      - key: ABM_DATA_DIR
        value: /tmp/abm-data
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional: enable Gemini TTS (premium voices) by setting these:
      # - key: ABM_GEMINI_BACKEND
      #   value: vertex
      # - key: ABM_GEMINI_API_KEY
      #   sync: false  # set manually in Render dashboard
      # Optional: enable S3-compatible storage (Cloudflare R2, Backblaze B2, etc.)
      # instead of local filesystem — this works on free tier:
      # - key: ABM_S3_ENDPOINT
      #   sync: false
      # - key: ABM_S3_ACCESS_KEY
      #   sync: false
      # - key: ABM_S3_SECRET_KEY
      #   sync: false
      # - key: ABM_S3_BUCKET
      #   sync: false
    # Health check: the Flask app responds to GET / with a 200 (redirect to /en/)
    healthCheckPath: /
    autoDeploy: true
    # Free tier: 0.1 CPU, 512 MB RAM. Spins down after 15 min of inactivity
    # (first request after spin-down takes ~30s to wake).
    plan: free

    # ── PERSISTENT DISK (requires Starter plan or higher, $7/mo) ──
    # Uncomment this section AFTER upgrading to Starter. It gives you
    # persistent storage so jobs + audio survive deploys and restarts.
    # disk:
    #   name: audiobook-data
    #   mountPath: /opt/data
    #   sizeGB: 5
