# Render Blueprint — audiobook-maker Flask service
# https://render.com/docs/blueprint-spec
# One-click deploy: connect your GitHub repo, Render reads this file and
# creates the web service automatically.
#
# ARCHITECTURE:
#   - Flask app runs on Render free tier (ephemeral storage)
#   - Audio files + tokens persist to Cloudflare R2 (10 GB free, zero egress)
#   - Gemini API for LLM text optimization + Gemini TTS premium voices
#   - edge-tts as the free default voice (Gemini voices are premium upgrades)
#   - 7-day job retention (ABM_JOB_RETENTION_SEC=604800)
#
# After deploy, set these secrets manually in Render dashboard:
#   - ABM_GEMINI_API_KEY  (from https://aistudio.google.com/apikey)
#   - ABM_LLM_API_KEY     (same Gemini key — works for both LLM + TTS)
#   - ABM_S3_ENDPOINT     (e.g. https://<accountid>.r2.cloudflarestorage.com)
#   - ABM_S3_ACCESS_KEY   (from R2 → Manage R2 API Tokens)
#   - ABM_S3_SECRET_KEY
#   - ABM_S3_BUCKET       (your R2 bucket name)

services:
  - type: web
    name: aria-audiobook-service
    runtime: python
    rootDir: mini-services/audiobook-maker
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install flask edge-tts ebooklib beautifulsoup4 lxml Pillow pymupdf flask-compress defusedxml openai google-genai google-cloud-texttospeech
    startCommand: python audiobook_app.py
    envVars:
      # ── Core ──
      - key: ABM_DATA_DIR
        value: /tmp/abm-data
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 7-day retention (was 18h default). Audio survives in R2 across restarts.
      - key: ABM_JOB_RETENTION_SEC
        value: "604800"

      # ── Gemini TTS (premium voices) ──
      # Uses the Gemini API key for TTS synthesis. Voices prefixed with
      # "gemini:" in the voice catalog will use this. Edge-tts voices remain
      # free and work without this key.
      - key: ABM_GEMINI_BACKEND
        value: apikey
      - key: ABM_GEMINI_API_KEY
        sync: false  # set manually — get from https://aistudio.google.com/apikey
      # Make Gemini voices free for ARIA users (no PayPal payment required).
      # The audiobook-maker app was designed for commercial use with PayPal;
      # ARIA is free, so we set the thresholds high enough that all jobs are free.
      - key: ABM_GEMINI_FREE_THRESHOLD_EUR
        value: "1000"
      - key: ABM_FREE_QUOTA_EUR_PER_MONTH
        value: "10000"
      - key: ABM_SPEECHIFY_FREE_THRESHOLD_EUR
        value: "1000"

      # ── Gemini LLM (text optimization) ──
      # Rewrites each chapter's text for better TTS quality before synthesis.
      # Uses Gemini's OpenAI-compatible endpoint. Same API key as TTS.
      # Note: Google discontinued AIzaSy keys — new keys use the AQ. format.
      - key: ABM_LLM_API_KEY
        sync: false  # set manually — same Gemini key as ABM_GEMINI_API_KEY
      - key: ABM_LLM_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: ABM_LLM_MODEL
        value: gemini-2.5-flash

      # ── Cloudflare R2 (persistent storage — survives Render restarts) ──
      # Audio files + download tokens are uploaded to R2 after generation.
      # On restart, tokens are restored from R2, and chapter MP3s are served
      # via presigned URLs. Create a bucket at https://r2.cloudflarestorage.com
      # then generate API tokens under "Manage R2 API Tokens".
      - key: ABM_S3_ENDPOINT
        sync: false  # e.g. https://<accountid>.r2.cloudflarestorage.com
      - key: ABM_S3_ACCESS_KEY
        sync: false
      - key: ABM_S3_SECRET_KEY
        sync: false
      - key: ABM_S3_BUCKET
        sync: false

    healthCheckPath: /
    autoDeploy: true
    plan: free

    # ── PERSISTENT DISK (requires Starter plan or higher, $7/mo) ──
    # Uncomment this section AFTER upgrading to Starter. With R2 configured,
    # a disk is optional (R2 already provides persistence), but it avoids
    # the 30s cold-start redirect for audio playback.
    # disk:
    #   name: audiobook-data
    #   mountPath: /opt/data
    #   sizeGB: 5
