name: Convert Audiobook

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      epub_url:
        required: true
        type: string
      audiobook_id:
        required: false
        type: string
        default: ''
      # Comma-separated list of chapter `order` values to convert.
      # Empty/omitted = convert the whole book (legacy behavior).
      # When populated, the Python script filters the parsed chapters to
      # only those in this list, leaving the rest unconverted.
      chapter_indices:
        required: false
        type: string
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install google-cloud-texttospeech google-cloud-storage ebooklib beautifulsoup4 lxml requests aiohttp

      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Run conversion
        env:
          JOB_ID: ${{ inputs.job_id }}
          EPUB_URL: ${{ inputs.epub_url }}
          AUDIOBOOK_ID: ${{ inputs.audiobook_id }}
          CHAPTER_INDICES: ${{ inputs.chapter_indices }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_CALLBACK_SECRET: ${{ secrets.APP_CALLBACK_SECRET }}
          GCS_AUDIOBOOK_BUCKET: ${{ secrets.GCS_AUDIOBOOK_BUCKET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python .github/scripts/convert_audiobook.py
