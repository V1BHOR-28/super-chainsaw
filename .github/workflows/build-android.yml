# .github/workflows/build-android.yml
#
# Free Android APK auto-build + release pipeline for ARIA.
#
# Trigger: any push to main OR a manually dispatched run, OR a tag v*.
# On tag v*, creates a GitHub Release with the signed APK attached.
# On push to main, uploads the APK as a build artifact (downloadable from
# the Actions tab) - no Release is created, so users always get the freshest
# build via the latest-artifact URL.
#
# Cost: $0. Public repos get unlimited GitHub Actions minutes.
#
# Signing secrets expected:
#   KEYSTORE_BASE64       base64 of release keystore (.jks)
#   KEYSTORE_PASSWORD     keystore password
#   KEY_ALIAS             key alias inside the keystore
#   KEY_PASSWORD          key password
# If secrets are missing, falls back to a debug-signed APK.
#
# Architecture: the APK is a thin Capacitor WebView shell that loads the
# deployed Next.js URL (MOBILE_URL repo variable) at runtime via
# capacitor.config.ts server.url. No Next.js bundle is built here.

name: build-android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_MOBILE_URL: "${{ vars.MOBILE_URL || 'https://ariaggn.vercel.app' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor CLI
        run: npm install --no-audit --no-fund --no-save @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7

      - name: Add Android platform
        run: npx cap add android || true

      - name: Create placeholder web bundle
        run: |
          mkdir -p out
          sed "s|{{MOBILE_URL}}|$NEXT_PUBLIC_MOBILE_URL|g" mobile/placeholder.html > out/index.html
          ls -la out/

      - name: Sync Capacitor
        run: npx cap sync android
        env:
          NEXT_PUBLIC_MOBILE_URL: ${{ env.NEXT_PUBLIC_MOBILE_URL }}

      - name: Patch AndroidManifest for foreground audio service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' "$MANIFEST"
            grep -q 'WAKE_LOCK' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            grep -q 'MediaSessionService' "$MANIFEST" || \
              sed -i '/<\/application>/i\        <service android:name="androidx.media.session.MediaSessionService" android:exported="false" android:foregroundServiceType="mediaPlayback" />' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          echo "signed=true" >> $GITHUB_ENV

      - name: Configure Gradle signing
        if: env.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/app/signing.properties
          cat android/app/signing.properties

      - name: Build release APK
        if: env.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease

      - name: Build debug APK
        if: env.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: Locate built APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          echo "apk_name=aria-${VERSION}.apk" >> $GITHUB_ENV

      - name: Rename APK
        run: cp "$apk_path" "$apk_name" && ls -lh "$apk_name"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android
          path: ${{ env.apk_name }}
          retention-days: 30
          if-no-files-found: error

      - name: Generate QR code for install URL
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF#refs/tags/}/${apk_name}"
          else
            URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "install_url=$URL" >> $GITHUB_ENV
          pip install --quiet qrcode
          python -c "import qrcode; qrcode.make('$URL').save('install-qr.png')"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.apk_name }}
            install-qr.png
          body: |
            ## ARIA Android ${{ github.ref_name }}

            Scan the QR code with your phone's camera, or click the link:

            [Download APK](${{ env.install_url }})

            ### Install instructions
            1. Tap the downloaded .apk file in your notifications
            2. Tap "Install anyway" when Android warns about unknown sources
            3. Open ARIA - sign in (or create an account) and you're in

            APK is signed with ${{ env.signed == 'true' && 'release' || 'debug' }} keys.

            ![QR Code](install-qr.png)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
