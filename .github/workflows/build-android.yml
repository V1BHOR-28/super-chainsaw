# .github/workflows/build-android.yml
#
# Free Android APK auto-build + release pipeline for ARIA.
#
# Trigger: any push to `main` OR a manually dispatched run, OR a tag `v*`.
# On tag `v*`, it creates a GitHub Release with the signed APK attached.
# On push to main, it uploads the APK as a build artifact (downloadable from
# the Actions tab) — no Release is created, so users always get the freshest
# build via the latest-artifact URL.
#
# Cost: $0. Public repos get unlimited GitHub Actions minutes.
#
# Signing: the workflow expects these repo secrets to be set
#   KEYSTORE_BASE64       base64 of release keystore (.jks)
#   KEYSTORE_PASSWORD     keystore password
#   KEY_ALIAS             key alias inside the keystore
#   KEY_PASSWORD          key password (often same as KEYSTORE_PASSWORD)
# If secrets are missing, the workflow falls back to a debug-signed APK
# (still installable via sideload, but with a different signature each build).
#
# Architecture
# ------------
# The APK is a thin Capacitor WebView shell — it loads the deployed Next.js
# URL (MOBILE_URL repo variable) at runtime via capacitor.config.ts's
# server.url directive. We do NOT need to build a Next.js bundle here — just
# produce a placeholder out/index.html + sync the native project.

name: build-android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The deployed Next.js backend URL — the WebView loads this at runtime.
      NEXT_PUBLIC_MOBILE_URL: ${{ vars.MOBILE_URL || 'https://ariaggn.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # NOTE: no cache: npm — this repo uses bun.lock, not package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor CLI
        run: npm install --no-audit --no-fund --no-save @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7

      - name: Add Android platform
        run: npx cap add android || true   # idempotent — skip if already added

      - name: Create placeholder web bundle
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>ARIA</title>
              <style>
                html, body {
                  margin: 0; padding: 0; height: 100%;
                  background: #0a0a0f; color: #fcd96a;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  display: flex; align-items: center; justify-content: center;
                }
                .c { text-align: center; padding: 2rem; }
                .l { width: 64px; height: 64px; margin: 0 auto 1rem;
                     border: 3px solid #fcd96a; border-top-color: transparent;
                     border-radius: 50%; animation: s 1s linear infinite; }
                @keyframes s { to { transform: rotate(360deg); } }
                h1 { font-size: 1.2rem; margin: 0 0 0.5rem; font-weight: 500; }
                p { font-size: 0.875rem; opacity: 0.7; margin: 0; }
              </style>
            </head>
            <body>
              <div class="c">
                <div class="l"></div>
                <h1>ARIA</h1>
                <p>Connecting…</p>
              </div>
              <script>
                // When server.url is set in capacitor.config.ts, Capacitor loads
                // that URL instead of this file. This placeholder is only shown
                // if the remote URL is unreachable.
                setTimeout(function() {
                  var u = "${{ env.NEXT_PUBLIC_MOBILE_URL }}";
                  if (location.href.indexOf(u) === -1) {
                    window.location.href = u;
                  }
                }, 1500);
              </script>
            </body>
          </html>
          ls -la out/

      - name: Sync Capacitor (reads NEXT_PUBLIC_MOBILE_URL → server.url)
        run: npx cap sync android
        env:
          NEXT_PUBLIC_MOBILE_URL: ${{ env.NEXT_PUBLIC_MOBILE_URL }}

      - name: Patch AndroidManifest for foreground audio service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            # Add permissions needed for Media Session + background audio
            grep -q 'FOREGROUND_SERVICE' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' "$MANIFEST"
            grep -q 'WAKE_LOCK' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            grep -q 'POST_NOTIFICATIONS' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            # Add the media service declaration (Android 14+ requires foregroundServiceType)
            grep -q 'MediaSessionService' "$MANIFEST" || \
              sed -i '/<\/application>/i\        <service android:name="androidx.media.session.MediaSessionService" android:exported="false" android:foregroundServiceType="mediaPlayback" />' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Decode signing keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          echo "signed=true" >> $GITHUB_ENV

      - name: Configure Gradle signing (if keystore present)
        if: env.signed == 'true'
        run: |
          cat > android/app/signing.properties <<EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cat android/app/signing.properties

      - name: Build release APK (signed)
        if: env.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease

      - name: Build debug APK (fallback when no signing secrets)
        if: env.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: Locate built APK
        id: find
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          echo "apk_name=aria-${VERSION}.apk" >> $GITHUB_ENV
          echo "Found APK: $APK"

      - name: Rename APK
        run: |
          cp "$apk_path" "$apk_name"
          ls -lh "$apk_name"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android
          path: ${{ env.apk_name }}
          retention-days: 30
          if-no-files-found: error

      - name: Generate QR code for install URL
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF#refs/tags/}/${apk_name}"
          else
            URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "install_url=$URL" >> $GITHUB_ENV
          pip install --quiet qrcode
          python -c "import qrcode; qrcode.make('$URL').save('install-qr.png')"
          echo "QR encoded URL: $URL"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.apk_name }}
            install-qr.png
          body: |
            ## ARIA Android ${{ github.ref_name }}

            Scan the QR code with your phone's camera, or click the link:

            👉 [Download APK](${{ env.install_url }})

            ### Install instructions
            1. Tap the downloaded `.apk` file in your notifications
            2. Tap **"Install anyway"** when Android warns about unknown sources
            3. Open ARIA — sign in (or create an account) and you're in

            > APK is signed with `${{ env.signed == 'true' && 'release' || 'debug' }}` keys.

            ![QR Code](install-qr.png)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
