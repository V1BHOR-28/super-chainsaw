name: Verify ARIA Fixes

# Runs automatically on every push and every pull request targeting main.
# No one has to remember to run this by hand — GitHub runs it for you.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Backfill missing memory embeddings
        # Idempotent: finds Memory rows with NULL embeddings (created while the
        # Gemini model-name bug was active) and generates them now. No-op when
        # zero rows need backfilling. Must run BEFORE verify so check 6 passes.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run backfill:memory

      - name: Run verification script
        env:
          # These come from GitHub → Settings → Secrets → Actions
          # (one-time setup — see SETUP.md in this same folder)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run verify:memory

      # If verify:memory exits non-zero, this job fails, which shows as a red
      # ❌ on the commit/PR in GitHub — you don't have to read logs to know
      # something's wrong. Green ✅ means it actually passed, not "an agent
      # said it passed."
