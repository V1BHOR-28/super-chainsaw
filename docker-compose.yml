# docker-compose.yml — audiobook-maker backend (Docker, local-first) + ngrok Tunnel.

services:
  audiobook:
    build: .
    env_file: .env
    ports:
      - "5601:5601"
    restart: unless-stopped
    # Memory limit: 8GB host RAM, leave headroom for ngrok (~50MB), host OS
    # (~2GB), browser/editor (~2GB). 3GB for the audiobook container covers
    # Flask + edge-tts + Kokoro model (~330MB) + audio processing buffers.
    # A runaway Kokoro load degrades as a contained OOM kill, not a full
    # host slowdown.
    mem_limit: 3g
    volumes:
      # Named volume — survives container restarts/rebuilds/deletes.
      # This is where EPUBs, generated MP3s, tokens, and the job registry live.
      - audiobook_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5601/api/voices')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  tunnel:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http audiobook:5601 --url=${NGROK_DOMAIN}
    depends_on:
      audiobook:
        condition: service_healthy
    restart: unless-stopped

volumes:
  audiobook_data:
