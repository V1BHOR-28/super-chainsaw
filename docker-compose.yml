# docker-compose.yml — audiobook-maker backend (Docker, local-first).
#
# One service: the Flask app. All local state lives in a named volume
# mounted at /app/data — this is the durable primary store. Storj/R2 (if
# configured via .env) is an off-site backup target, not the source of truth.
#
# The app is reachable at http://localhost:5601 from the host. Put a reverse
# proxy (Caddy, nginx, Cloudflare Tunnel) in front for HTTPS.

services:
  audiobook:
    build: .
    env_file: .env
    ports:
      - "5601:5601"
    restart: unless-stopped
    volumes:
      # Named volume — survives container restarts/rebuilds/deletes.
      # This is where EPUBs, generated MP3s, tokens, and the job registry live.
      - audiobook_data:/app/data
    # If Storj env vars are absent, the app degrades to local-only (no sync).
    # storage_backend.is_enabled() gates every Storj call.

volumes:
  audiobook_data:
